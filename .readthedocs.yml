version: 2
build:
  os: ubuntu-22.04
  tools:
    # this ensures a viable `mamba` is on `$PATH``
    python: mambaforge-latest
  commands:
    - mamba install -c conda-forge -c nodefaults pixi
    - pixi install
    - pixi run build
    - pixi run filter-kernels
    # A failed beta build must not fail the preview of the stable site.
    - pixi run build-beta || rm -rf dist/beta
    - pixi run readthedocs
