version: 2
build:
  os: ubuntu-22.04
  tools:
    # this ensures a viable `mamba` is on `$PATH``
    python: mambaforge-latest
  commands:
    - mamba install -c conda-forge -c nodefaults pixi
    # A project with the environment variable TRY_JUPYTER_SITE=beta hosts the beta site.
    - |
      if [ "$TRY_JUPYTER_SITE" = "beta" ]; then
        pixi run readthedocs-beta
      else
        pixi install && pixi run build && pixi run filter-kernels && pixi run readthedocs
      fi
